name: Generate and Dispatch Build Workflow

on:
  workflow_dispatch:
    inputs:
      firmware_type:
        type: choice
        required: true
        default: "immortalwrt"
        options:
          - "openwrt"
          - "immortalwrt"
      openwrt_version:
        type: string
        required: true
        default: "24.10.2"
      amneziawg_version:
        type: string
        required: true
        default: "master"

jobs:
  generate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Fetch targets and generate matrix
        id: gen
        run: |
          set -e -x
          version="${{ inputs.openwrt_version }}"
          fw="${{ inputs.firmware_type }}"

          if [ "$fw" = "openwrt" ]; then
            base="https://downloads.openwrt.org/releases/$version/targets"
            sdk_pat="openwrt-sdk"
          else
            base="https://downloads.immortalwrt.org/releases/$version/targets"
            sdk_pat="immortalwrt-sdk"
          fi

          matrix="[]"

          for target in $(curl -s $base/ | grep -oE 'href="[^/]+/' | sed 's/href="//;s/\/$//'); do
            for sub in $(curl -s $base/$target/ | grep -oE 'href="[^/]+/' | sed 's/href="//;s/\/$//'); do
              cfg="$base/$target/$sub/config.buildinfo"
              arch=$(curl -fsL "$cfg" | grep '^CONFIG_TARGET_ARCH_PACKAGES=' | cut -d'"' -f2 || true)
              if [ -n "$arch" ]; then
                matrix=$(echo "$matrix" | jq ". + [{\"arch\":\"$arch\",\"target\":\"$target\",\"subtarget\":\"$sub\"}]")
              fi
            done
          done

          echo "matrix=$matrix" >> $GITHUB_OUTPUT

      - name: Generate workflow file
        run: |
          cat > .github/workflows/build-generated.yml <<'EOF'
          name: Build AmneziaWG (Generated)

          on:
            workflow_dispatch:

          jobs:
            build:
              strategy:
                fail-fast: false
                matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
              runs-on: ubuntu-22.04
              steps:
                - run: echo "Arch ${{ matrix.arch }}, Target ${{ matrix.target }}, Subtarget ${{ matrix.subtarget }}"
          EOF

      - name: Commit generated workflow
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .github/workflows/build-generated.yml
          git commit -m "Update generated build workflow" || echo "No changes"
          git push

      - name: Trigger generated workflow
        run: |
          gh workflow run build-generated.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
