name: Generate Build Matrix

on:
  workflow_dispatch:
    inputs:
      firmware_type:
        description: "Firmware type"
        type: choice
        required: true
        default: "openwrt"
        options:
          - "openwrt"
          - "immortalwrt"
      openwrt_version:
        description: "OpenWrt/ImmortalWrt version"
        type: string
        required: true
        default: "24.10.3"
      amneziawg_version:
        description: "AmneziaWG version"
        type: string
        required: true
        default: "master"

jobs:
  generate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Parse targets list
        id: parse
        run: |
          set -e
          if [ "${{ inputs.firmware_type }}" = "openwrt" ]; then
            base_url="https://downloads.openwrt.org/releases/${{ inputs.openwrt_version }}/targets/"
          else
            base_url="https://downloads.immortalwrt.org/releases/${{ inputs.openwrt_version }}/targets/"
          fi

          echo "Fetching targets from $base_url"
          targets=$(curl -s "$base_url" | grep -oP '(?<=href=")[^"/]+(?=/")')
          echo "Found targets: $targets"

          # Собираем JSON для матрицы
          matrix="["
          first=true
          for t in $targets; do
            subs=$(curl -s "$base_url$t/" | grep -oP '(?<=href=")[^"/]+(?=/")')
            for s in $subs; do
              if [ "$first" = true ]; then
                first=false
              else
                matrix="$matrix,"
              fi
              matrix="$matrix{\"target\":\"$t\",\"subtarget\":\"$s\"}"
            done
          done
          matrix="$matrix]"

          echo "matrix=$matrix" >> $GITHUB_OUTPUT

      - name: Generate build-generated.yml
        run: |
          cat > .github/workflows/build-generated.yml <<'EOF'
          name: Build AmneziaWG from OpenWRT/ImmortalWRT

          on:
            workflow_dispatch:

          jobs:
            build:
              name: Build for matrix
              runs-on: ubuntu-22.04
              strategy:
                fail-fast: false
                matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
              steps:
                - name: Checkout repo
                  uses: actions/checkout@v4
          EOF

      - name: Commit generated workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-generated.yml
          git commit -m "Update build-generated.yml from matrix"
          git push
