name: Build AmneziaWG Multi-target

on:
  workflow_dispatch:
    inputs:
      firmware_type:
        description: "Firmware type"
        type: choice
        required: true
        default: "immortalwrt"
        options:
          - "openwrt"
          - "immortalwrt"
      openwrt_version:
        description: "OpenWrt/ImmortalWrt version (e.g., 24.10.2, 23.05.6, SNAPSHOT)"
        type: string
        required: true
        default: "24.10.2"
      amneziawg_version:
        description: "AmneziaWG version"
        type: string
        required: true
        default: "master"

jobs:
  # =======================================================
  # Этап 1: Определение целей для сборки и создание матрицы
  # =======================================================
  prepare-targets:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      # Убедимся, что jq установлен
      - name: Install JQ (JSON processor)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Set build matrix (using reliable EOF output)
        id: set-matrix
        run: |
          set -e -x
          
          # Определяем базовый URL
          if [ "${{ inputs.firmware_type }}" = "openwrt" ]; then
            if [ "${{ inputs.openwrt_version }}" = "SNAPSHOT" ]; then
              base_url="https://downloads.openwrt.org/snapshots/targets"
            else
              base_url="https://downloads.openwrt.org/releases/${{ inputs.openwrt_version }}/targets"
            fi
          else
            if [ "${{ inputs.openwrt_version }}" = "SNAPSHOT" ]; then
              base_url="https://downloads.immortalwrt.org/snapshots/targets"
            else
              base_url="https://downloads.immortalwrt.org/releases/${{ inputs.openwrt_version }}/targets"
            fi
          fi
          
          echo "Fetching targets from: $base_url"
          targets=$(curl -sL "$base_url/" | grep -oP 'href="\K[^/"]+(?=/)' | grep -v '\.\.' | sort -u)
          
          if [ -z "$targets" ]; then
            echo "ERROR: Target directory not found at $base_url."
            exit 1 
          fi
          
          matrix_items=""
          for target in $targets; do
            subtargets=$(curl -sL "$base_url/$target/" | grep -oP 'href="\K[^/"]+(?=/)' | grep -v '\.\.' | sort -u)
            
            for subtarget in $subtargets; do
              if [ "${{ inputs.firmware_type }}" = "openwrt" ]; then
                sdk_file=$(curl -sL "$base_url/$target/$subtarget/" | grep -oP 'openwrt-sdk[^"]+\.tar\.(zst|xz|gz|bz2)' | head -n1)
              else
                sdk_file=$(curl -sL "$base_url/$target/$subtarget/" | grep -oP 'immortalwrt-sdk[^"]+\.tar\.(zst|xz|gz|bz2)' | head -n1)
              fi
              
              if [ -n "$sdk_file" ]; then
                arch=$(echo "$sdk_file" | sed -E 's/.*_gcc-[0-9.]+_([^.]+)\.Linux.*/\1/')
                
                if [ -n "$arch" ] && [ "$arch" != "$sdk_file" ] && [ "$arch" != "skip" ]; then
                  echo "  Found SDK for $target/$subtarget (Arch: $arch)"
                  
                  if [ -n "$matrix_items" ]; then
                    matrix_items="$matrix_items,"
                  fi
                  matrix_items="$matrix_items{\"target\":\"$target\",\"subtarget\":\"$subtarget\",\"arch\":\"$arch\"}"
                fi
              fi
            done
          done
          
          if [ -z "$matrix_items" ]; then
            echo "ERROR: No valid targets found with SDK and valid architecture. Exiting."
            exit 1 
          fi
          
          matrix_json="{\"include\":[$matrix_items]}"
          
          # 🔥 Критический шаг: очищаем и выводим JSON в компактном формате
          clean_matrix=$(echo "$matrix_json" | jq -c .)
          
          if [ $? -ne 0 ]; then
              echo "FATAL ERROR: JQ validation failed. Matrix is corrupted."
              exit 1
          fi

          # 🔥 Используем надежный синтаксис GITHUB_OUTPUT с EOF
          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$clean_matrix" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "Generated matrix successfully sent to GITHUB_OUTPUT."
          echo "Total valid targets found: $(echo "$clean_matrix" | jq '.include | length')"

---

  # =======================================================
  # Этап 2: Сборка пакетов с использованием матрицы
  # =======================================================
  build-amneziawg:
    # 🔥 Упрощенное имя задачи, чтобы избежать сбоев парсинга при большой матрице
    name: "Build AWG Target: ${{ matrix.target }}/${{ matrix.subtarget }}"
    needs: prepare-targets
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.prepare-targets.outputs.matrix) }} 
    defaults:
      run:
        shell: bash
    
    steps:
    - name: Checkout AWG repository
      uses: actions/checkout@v5
      with:
        path: amneziawg
        ref: ${{ inputs.amneziawg_version }}
        fetch-depth: 0

    - name: Install dependencies and clean space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean
        sudo apt-get update
        sudo apt-get install -y python3-pyelftools python3-dev python3-setuptools swig jq

    - name: Download and prepare SDK
      run: |
        set -e -x
        
        # Функция для повторных попыток загрузки
        retry_command() {
          local max_attempts=3
          local delay=5
          local attempt=1
          local command="$@"
          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts: $command"
            if eval "$command"; then return 0; fi
            echo "Command failed. Retrying in ${delay}s..."
            sleep $delay
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done
          echo "Command failed after $max_attempts attempts"
          return 1
        }
        
        if [ "${{ inputs.firmware_type }}" = "openwrt" ]; then
          if [ "${{ inputs.openwrt_version }}" = "SNAPSHOT" ]; then
            base_url="https://downloads.openwrt.org/snapshots/targets/${{ matrix.target }}/${{ matrix.subtarget }}/"
          else
            base_url="https://downloads.openwrt.org/releases/${{ inputs.openwrt_version }}/targets/${{ matrix.target }}/${{ matrix.subtarget }}/"
          fi
          sdk_pattern="openwrt-sdk"
        else
          # ImmortalWrt URLs
          if [ "${{ inputs.openwrt_version }}" = "SNAPSHOT" ]; then
            base_url="https://downloads.immortalwrt.org/snapshots/targets/${{ matrix.target }}/${{ matrix.subtarget }}/"
          else
            base_url="https://downloads.immortalwrt.org/releases/${{ inputs.openwrt_version }}/targets/${{ matrix.target }}/${{ matrix.subtarget }}/"
          fi
          sdk_pattern="immortalwrt-sdk"
        fi
        
        sdk_url=$(curl -sL "${base_url}" | grep -oP "href=\"${sdk_pattern}[^\"]+\.tar\.(zst|xz|gz|bz2)\"" | sed -e 's/href="//' -e 's/"$//' | head -n1)
        if [[ -z "$sdk_url" ]]; then echo "SDK file not found."; exit 1; fi
        
        echo "Downloading SDK: $base_url$sdk_url"
        retry_command "curl -fsLO '$base_url$sdk_url'"
        file_name=$(basename "$sdk_url")
        
        tar -xf "$file_name"
        rm -f *.tar.*
        mv *"${sdk_pattern}"* openwrt

        echo "src-cpy awgopenwrt ../amneziawg" >> openwrt/feeds.conf.default
        retry_command "./openwrt/scripts/feeds update -a"
        
        # Загрузка и настройка .config
        curl -fsL "$base_url/config.buildinfo" > openwrt/.config || curl -fsL "$base_url/config.seed" > openwrt/.config
        
        echo "CONFIG_PACKAGE_kmod-crypto-lib-chacha20=m" >> openwrt/.config
        echo "CONFIG_PACKAGE_kmod-crypto-lib-chacha20poly1305=m" >> openwrt/.config
        echo "CONFIG_PACKAGE_kmod-crypto-chacha20poly1305=m" >> openwrt/.config
        echo "CONFIG_PACKAGE_kmod-amneziawg=m" >> openwrt/.config
        echo "CONFIG_PACKAGE_amneziawg-tools=m" >> openwrt/.config
        echo "CONFIG_PACKAGE_luci-proto-amneziawg=m" >> openwrt/.config
        
        retry_command "./openwrt/scripts/feeds install -a"
        make -C openwrt defconfig

    - name: Update Makefiles latest commits
      run: |
        set -e -x
        cd openwrt/package/feeds/awgopenwrt
        update_pkg() {
          local pkg_dir="$1"; local repo="$2"; local branch="$3"
          commit=$(git ls-remote "$repo" "$branch" | awk '{print $1; exit}')
          url="$repo/archive/$commit.tar.gz"
          hash=$(curl -L --retry 3 -s "$url" | sha256sum | cut -d' ' -f1)
          if [ -d "$pkg_dir" ]; then
            cd "$pkg_dir"
            sed -i "s/^PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=$commit/" Makefile
            sed -i "s/^PKG_MIRROR_HASH:=.*/PKG_MIRROR_HASH:=$hash/" Makefile
            cd - >/dev/null
          fi
        }
        update_pkg "kmod-amneziawg" "https://github.com/amnezia-vpn/amneziawg-linux-kernel-module.git" "feature/awg2"
        update_pkg "amneziawg-tools" "https://github.com/amnezia-vpn/amneziawg-tools.git" "master"
        cd - >/dev/null

    - name: Compile and Install AmneziaWG packages 🚀
      run: |
        set -e -x
        cd openwrt
        # Используем 'install' для копирования .ipk в bin/targets и bin/packages
        make package/kmod-amneziawg/{clean,download,prepare,compile,install} -j $(nproc)
        make package/luci-proto-amneziawg/{clean,download,prepare,compile,install} -j $(nproc)
        make package/amneziawg-tools/{clean,download,prepare,compile,install} -j $(nproc)

    - name: Prepare artifacts
      id: prepare_artifacts
      run: |
        set -e -x
        mkdir awgrelease
        
        # Собираем kmod-amneziawg (из папки targets)
        find "openwrt/bin/targets/${{ matrix.target }}/${{ matrix.subtarget }}/packages" -maxdepth 1 -type f -name 'kmod-amneziawg*' -exec cp {} awgrelease/ \; 2>/dev/null || true
        
        # Собираем tools и luci (из папки packages/arch)
        find "openwrt/bin/packages/${{ matrix.arch }}/awgopenwrt" -maxdepth 1 -type f \( -name 'amneziawg-tools*' -o -name 'luci-proto-amneziawg*' \) -exec cp {} awgrelease/ \; 2>/dev/null || true
        
        if [ -z "$(ls -A awgrelease)" ]; then
          echo "ERROR: No packages found in awgrelease folder after compilation."
          exit 1
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: awg-${{ inputs.firmware_type }}-${{ inputs.openwrt_version }}-${{ matrix.target }}-${{ matrix.subtarget }}-${{ matrix.arch }}
        path: awgrelease/*
        retention-days: 30

---

  # =======================================================
  # Этап 3: Создание релиза
  # =======================================================
  create-release:
    name: Create Release 📦
    needs: build-amneziawg
    runs-on: ubuntu-22.04
    if: always() 
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-releases

      - name: Organize files and generate package list
        id: organize_files
        run: |
          mkdir -p final-release
          find all-releases -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} final-release/ \;
          
          package_count=$(ls -1 final-release/ | wc -l)
          echo "package_count=$package_count" >> $GITHUB_OUTPUT

          echo "# Package List" > PACKAGES.md
          echo "## ${{ inputs.firmware_type }} ${{ inputs.openwrt_version }} Packages" >> PACKAGES.md
          echo "| File | Size |" >> PACKAGES.md
          echo "|:---|:---|" >> PACKAGES.md
          
          cd final-release
          for file in *; do
            size=$(du -h "$file" | awk '{print $1}')
            echo "| \`$file\` | $size |" >> ../PACKAGES.md
          done
          cd ..
          
          echo "release_files=final-release/* PACKAGES.md" >> $GITHUB_OUTPUT

      - name: Get current date
        id: get_date
        run: echo "date=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
        
      - name: Create Release
        if: steps.organize_files.outputs.package_count > 0
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.organize_files.outputs.release_files }}
          tag_name: ${{ inputs.firmware_type }}-${{ inputs.openwrt_version }}-all-targets-${{ github.run_number }}
          name: 'AmneziaWG ${{ inputs.firmware_type }}-${{ inputs.openwrt_version }} (All Targets)'
          body: |
            🚀 Автоматическая сборка пакетов AmneziaWG для всех целевых платформ OpenWrt/ImmortalWrt.
            
            **Полный список пакетов для всех архитектур находится в файле PACKAGES.md.**
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
