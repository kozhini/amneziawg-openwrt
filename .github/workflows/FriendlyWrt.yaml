name: Build AmneziaWG on FriendlyWrt Toolchain

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: "FriendlyWrt version"
        type: choice
        required: true
        default: "23.05"
        options:
          - "23.05"
          - "24.10"

jobs:
  build_toolchain:
    runs-on: ubuntu-22.04
    name: Build FriendlyWrt Toolchain

    steps:
      - name: Checkout FriendlyWrt
        uses: actions/checkout@v5
        with:
          repository: friendlyarm/Actions-FriendlyWrt
          path: friendlywrt/project
          fetch-depth: 0

      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget ccache libncurses5-dev python3 python3-dev python3-setuptools subversion gawk unzip texinfo rsync
          sudo swapoff -a
          sudo -E git config --global user.name 'GitHub Actions'
          sudo -E git config --global user.email 'noreply@github.com'
          mkdir -p friendlywrt/artifact
          echo "cores: $(nproc)"

      - name: Initialize FriendlyWrt repo
        run: |
          cd friendlywrt/project
          repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ github.event.inputs.VERSION }} -m rk3399.xml --repo-url=https://github.com/friendlyarm/repo
          repo sync -c toolchain --no-clone-bundle

      - name: Build toolchain
        run: |
          cd friendlywrt/project
          ./build.sh toolchain

      - name: Cache toolchain
        uses: actions/cache@v3
        with:
          key: fwrt-toolchain-${{ github.event.inputs.VERSION }}
          path: |
            friendlywrt/project/toolchain
            friendlywrt/project/staging_dir
            friendlywrt/project/build_dir

  build_amneziawg:
    runs-on: ubuntu-22.04
    needs: build_toolchain
    name: Build AmneziaWG Packages

    steps:
      - name: Checkout AmneziaWG
        uses: actions/checkout@v5
        with:
          path: amneziawg
          fetch-depth: 0

      - name: Restore toolchain cache
        uses: actions/cache@v3
        with:
          key: fwrt-toolchain-${{ github.event.inputs.VERSION }}
          path: |
            friendlywrt/project/toolchain
            friendlywrt/project/staging_dir
            friendlywrt/project/build_dir

      - name: Build AmneziaWG packages
        run: |
          cd friendlywrt/project
          make package/kmod-amneziawg/{clean,download,prepare,compile} -j$(nproc)
          make package/amneziawg-go/{clean,download,prepare,compile} -j$(nproc)
          make package/luci-proto-amneziawg/{clean,download,prepare,compile} -j$(nproc)
          make package/amneziawg-tools/{clean,download,prepare,compile} -j$(nproc)

      - name: Collect artifacts
        run: |
          mkdir -p artifact/amneziawg
          cp friendlywrt/project/bin/packages/*/*/*.ipk artifact/amneziawg/ || true
          cp friendlywrt/project/bin/packages/*/*/*.apk artifact/amneziawg/ || true
          cp friendlywrt/project/bin/targets/*/*/packages/kmod-amneziawg* artifact/amneziawg/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: amneziawg-packages-${{ github.event.inputs.VERSION }}
          path: artifact/amneziawg/
