name: Build AmneziaWG for FriendlyWrt (Optimized - No Full Toolchain)
on:
  workflow_dispatch:
    inputs:
      friendlywrt_version:
        description: "FriendlyWrt version"
        type: choice
        required: true
        default: "24.10"
        options:
          - "23.05"
          - "24.10"
      amneziawg_version:
        description: "AmneziaWG version"
        type: string
        required: true
        default: "master"
      target_cpu:
        description: "Target CPU"
        type: choice
        required: false
        default: "rk3328"
        options:
          - ""
          - "rk3328"
          - "rk3399"
          - "rk3566"
          - "rk3568"
          - "rk3576"
          - "rk3588"

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
    steps:
      - name: Generate release tag
        id: release_tag
        run: |
          release_tag="AmneziaWG-FriendlyWrt-${{ inputs.friendlywrt_version }}-$(date +%Y%m%d-%H%M)"
          echo "release_tag=$release_tag" >> $GITHUB_OUTPUT
          
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.release_tag }}
          name: "AmneziaWG FriendlyWrt ${{ inputs.friendlywrt_version }} - ${{ steps.release_tag.outputs.release_tag }}"
          draft: true
          prerelease: false

  build_amneziawg:
    needs: prepare_release
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target_cpu: ${{ inputs.target_cpu && fromJson(format('["{0}"]', inputs.target_cpu)) || fromJson('["rk3328","rk3399","rk3566","rk3568","rk3588"]') }}
      fail-fast: false
    
    steps:
      - name: Maximize build space
        run: |
          echo "Before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          echo "After cleanup:"
          df -h

      - name: Checkout repositories
        uses: actions/checkout@v4

      - name: Checkout AmneziaWG
        uses: actions/checkout@v4
        with:
          repository: kozhini/amneziawg-openwrt
          path: amneziawg-openwrt
          ref: ${{ inputs.amneziawg_version }}

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl \
            qemu-utils

      - name: Cache prebuilt toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            prebuilt-toolchain
          key: toolchain-aarch64-${{ inputs.friendlywrt_version }}-v2
          restore-keys: |
            toolchain-aarch64-${{ inputs.friendlywrt_version }}-
            toolchain-aarch64-

      - name: Download prebuilt toolchain if not cached
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p prebuilt-toolchain
          
          # Скачиваем готовый ARM64 toolchain от Linaro или Bootlin
          TOOLCHAIN_URL="https://toolchains.bootlin.com/downloads/releases/toolchains/aarch64/tarballs/aarch64--glibc--stable-2024.02-1.tar.bz2"
          
          echo "Downloading prebuilt toolchain..."
          wget -q "$TOOLCHAIN_URL" -O toolchain.tar.bz2
          tar xf toolchain.tar.bz2 -C prebuilt-toolchain --strip-components=1
          rm toolchain.tar.bz2

      - name: Setup minimal OpenWrt environment
        run: |
          # Клонируем только базовый OpenWrt без истории
          git clone --depth 1 --single-branch \
            --branch openwrt-${{ inputs.friendlywrt_version }} \
            https://git.openwrt.org/openwrt/openwrt.git openwrt-minimal
          
          cd openwrt-minimal
          
          # Добавляем только необходимые feeds
          cat > feeds.conf.default << EOF
          src-git packages https://git.openwrt.org/feed/packages.git^openwrt-${{ inputs.friendlywrt_version }}
          src-git luci https://git.openwrt.org/project/luci.git^openwrt-${{ inputs.friendlywrt_version }}
          src-link amneziawg ../amneziawg-openwrt
          EOF
          
          # Обновляем только нужные feeds
          ./scripts/feeds update packages luci amneziawg
          ./scripts/feeds install -a -p amneziawg
          ./scripts/feeds install -p packages libmnl libnl-tiny
          ./scripts/feeds install -p luci luci-base

      - name: Configure for package-only build
        run: |
          cd openwrt-minimal
          
          # Создаем минимальную конфигурацию
          cat > .config << 'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_DEVEL=y
          CONFIG_AUTOREMOVE=y
          CONFIG_BUILDBOT=y
          CONFIG_USE_CCACHE=y
          
          # Отключаем сборку ненужного
          # CONFIG_ALL_KMODS is not set
          # CONFIG_ALL_NONSHARED is not set
          # CONFIG_IB is not set
          # CONFIG_SDK is not set
          # CONFIG_TARGET_ROOTFS_TARGZ is not set
          
          # Используем внешний toolchain
          CONFIG_EXTERNAL_TOOLCHAIN=y
          CONFIG_TOOLCHAIN_ROOT="../prebuilt-toolchain"
          CONFIG_TARGET_NAME="aarch64-linux"
          CONFIG_TOOLCHAIN_PREFIX="aarch64-linux-"
          CONFIG_TOOLCHAIN_LIBC="glibc"
          
          # AmneziaWG пакеты
          CONFIG_PACKAGE_kmod-amneziawg=m
          CONFIG_PACKAGE_amneziawg-tools=m
          CONFIG_PACKAGE_luci-proto-amneziawg=m
          
          # Необходимые crypto модули
          CONFIG_PACKAGE_kmod-crypto-aead=m
          CONFIG_PACKAGE_kmod-crypto-hash=m
          CONFIG_PACKAGE_kmod-crypto-kpp=m
          CONFIG_PACKAGE_kmod-crypto-manager=m
          EOF
          
          make defconfig

      - name: Download package sources
        run: |
          cd openwrt-minimal
          make download -j$(nproc) V=s || make download -j1 V=s

      - name: Build only AmneziaWG packages
        run: |
          cd openwrt-minimal
          
          # Устанавливаем ограничение памяти
          ulimit -v 6000000  # ~6GB
          
          # Определяем количество параллельных jobs
          JOBS=$(($(nproc) / 2))
          [ $JOBS -lt 1 ] && JOBS=1
          [ $JOBS -gt 4 ] && JOBS=4  # Максимум 4 для экономии памяти
          
          echo "Building with -j${JOBS}"
          
          # Собираем только userspace tools (не требует kernel)
          echo "=== Building amneziawg-tools ==="
          make package/feeds/amneziawg/amneziawg-tools/compile -j${JOBS} V=s 2>&1 | tee /tmp/build-tools.log || {
            echo "❌ Tools build failed"
            tail -100 /tmp/build-tools.log
          }
          
          # LuCI интерфейс
          echo "=== Building luci-proto-amneziawg ==="
          make package/feeds/amneziawg/luci-proto-amneziawg/compile -j${JOBS} V=s 2>&1 | tee /tmp/build-luci.log || {
            echo "❌ LuCI build failed"
            tail -100 /tmp/build-luci.log
          }
          
          # Kernel module - самый сложный, собираем в один поток если нужно
          KMOD_DIR=$(find feeds/amneziawg -maxdepth 1 -type d \( -name "*kmod*" -o -name "*kernel*" \) | head -1)
          if [ -n "$KMOD_DIR" ]; then
            KMOD_NAME=$(basename "$KMOD_DIR")
            echo "=== Building kernel module: $KMOD_NAME ==="
            
            # Сначала пытаемся с параллелизмом
            if ! make package/feeds/amneziawg/$KMOD_NAME/compile -j${JOBS} V=s 2>&1 | tee /tmp/build-kmod.log; then
              echo "⚠️ Parallel build failed, trying single-threaded..."
              make package/feeds/amneziawg/$KMOD_NAME/compile -j1 V=s 2>&1 | tee -a /tmp/build-kmod.log || {
                echo "❌ Kernel module build failed"
                tail -200 /tmp/build-kmod.log
              }
            fi
          fi
          
          # Установка и индексация
          make package/install V=s || true
          make package/index V=s || true

      - name: Collect build artifacts
        shell: bash
        run: |
          set +e
          
          ARTIFACT_DIR=artifact/amneziawg-packages/${{ matrix.target_cpu }}
          mkdir -p "${ARTIFACT_DIR}/logs"
          
          echo "=== Collecting IPK files ==="
          find openwrt-minimal/bin -name "*.ipk" -type f 2>/dev/null | while read file; do
            filename=$(basename "$file")
            if [[ "$filename" =~ (amneziawg|crypto) ]]; then
              cp "$file" "${ARTIFACT_DIR}/"
              echo "✅ $filename"
            fi
          done
          
          IPK_COUNT=$(find "${ARTIFACT_DIR}" -name "*.ipk" 2>/dev/null | wc -l)
          
          # Копируем логи
          cp /tmp/build-*.log "${ARTIFACT_DIR}/logs/" 2>/dev/null || true
          
          # Создаем отчет
          cat > "${ARTIFACT_DIR}/BUILD-REPORT.txt" << EOF
          AmneziaWG Build Report
          =====================
          Platform: ${{ matrix.target_cpu }}
          FriendlyWrt: ${{ inputs.friendlywrt_version }}
          AmneziaWG: ${{ inputs.amneziawg_version }}
          Build Date: $(date)
          
          IPK Packages: $IPK_COUNT
          
          Files:
          $(ls -lh "${ARTIFACT_DIR}"/*.ipk 2>/dev/null || echo "No IPK files found")
          
          Installation:
          1. Upload .ipk files to router
          2. opkg install *.ipk
          3. reboot
          
          Logs available in logs/ directory
          EOF
          
          echo "=== Build Summary ==="
          cat "${ARTIFACT_DIR}/BUILD-REPORT.txt"
          
          exit 0

      - name: Upload to release
        if: always()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare_release.outputs.release_tag }}
          files: |
            artifact/amneziawg-packages/${{ matrix.target_cpu }}/*.ipk
            artifact/amneziawg-packages/${{ matrix.target_cpu }}/BUILD-REPORT.txt
            artifact/amneziawg-packages/${{ matrix.target_cpu }}/logs/*.log
