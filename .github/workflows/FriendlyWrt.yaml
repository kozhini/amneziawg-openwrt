name: Build AmneziaWG for FriendlyWrt

on:
  workflow_dispatch:
    inputs:
      friendlywrt_version:
        description: "FriendlyWrt version"
        type: choice
        required: true
        default: "23.05"
        options:
          - "23.05"
          - "24.10"
      amneziawg_version:
        description: "AmneziaWG version"
        type: string
        required: true
        default: "master"
      target_cpu:
        description: "Target CPU (leave empty for all platforms)"
        type: choice
        required: false
        default: "rk3328"
        options:
          - ""
          - "rk3328"
          - "rk3528"
          - "rk3399"
          - "rk3566"
          - "rk3568"
          - "rk3576"
          - "rk3588"

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
    steps:
      - name: Get release tag
        id: release_tag
        run: |
          release_tag="AmneziaWG-FriendlyWrt-$(date +%Y-%m-%d-%H%M)"
          echo "release_tag=$release_tag" >> $GITHUB_OUTPUT

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.release_tag }}
          name: "AmneziaWG for FriendlyWrt ${{ inputs.friendlywrt_version }} - ${{ steps.release_tag.outputs.release_tag }}"
          draft: true
          prerelease: false

  build_amneziawg:
    needs: prepare_release
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target_cpu: ${{ inputs.target_cpu && fromJson(format('["{0}"]', inputs.target_cpu)) || fromJson('["rk3328","rk3399","rk3566","rk3568","rk3588"]') }}
      fail-fast: false

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Checkout AmneziaWG repository
        uses: actions/checkout@v5
        with:
          path: amneziawg
          ref: ${{ inputs.amneziawg_version }}
          fetch-depth: 0

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d
          sudo apt-get update
          sudo apt-get install -y python3-pyelftools python3-dev python3-setuptools swig wget git
          
          wget https://raw.githubusercontent.com/friendlyarm/build-env-on-ubuntu-bionic/master/install.sh
          sed -i -e 's/^apt-get -y install openjdk-8-jdk/# apt-get -y install openjdk-8-jdk/g' install.sh
          sed -i -e 's/^\[ -d fa-toolchain \]/# [ -d fa-toolchain ]/g' install.sh
          sed -i -e 's/^(cat fa-toolchain/# (cat fa-toolchain/g' install.sh
          sed -i -e 's/^(tar xf fa-toolchain/# (tar xf fa-toolchain/g' install.sh
          sudo -E bash ./install.sh

          # Install Go
          GO_VERSION=1.24.7 # Consider updating Go version periodically
          wget https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf go${GO_VERSION}.linux-amd64.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH
          echo "GOTOOLCHAIN=local" >> $GITHUB_ENV
          go version

          # Clean unused packages
          sudo swapoff -a
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk /usr/local/share/boost /opt/ghc

          # Install repo tool
          git clone https://github.com/friendlyarm/repo
          sudo cp repo/repo /usr/bin/

      - name: Download FriendlyWrt source
        run: |
          mkdir project
          cd project
          repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ inputs.friendlywrt_version }} \
                    -m ${{ matrix.target_cpu }}.xml --repo-url=https://github.com/friendlyarm/repo --no-clone-bundle
          repo sync -c friendlywrt configs device/common device/friendlyelec scripts toolchain --no-clone-bundle

      - name: Setup AmneziaWG feed and config
        run: |
          cd project
          mkdir -p amneziawg-feed
          cp -r ../amneziawg/* amneziawg-feed/
          echo "src-cpy amneziawg ../amneziawg-feed" >> friendlywrt/feeds.conf.default

          TARGET_IMAGE_DIRNAME=friendlywrt$(echo ${{ inputs.friendlywrt_version }} | awk -F . '{print $1}')
          TARGET_FRIENDLYWRT_CONFIG=rockchip
          echo "TARGET_IMAGE_DIRNAME=$TARGET_IMAGE_DIRNAME" >> $GITHUB_ENV
          echo "TARGET_FRIENDLYWRT_CONFIG=$TARGET_FRIENDLYWRT_CONFIG" >> $GITHUB_ENV

          echo "device/friendlyelec/${{ matrix.target_cpu }}/base.mk" > .current_config.mk
          echo "TARGET_IMAGE_DIRNAME=$TARGET_IMAGE_DIRNAME" >> .current_config.mk
          echo "TARGET_FRIENDLYWRT_CONFIG=$TARGET_FRIENDLYWRT_CONFIG" >> .current_config.mk

      - name: Apply customizations and update feeds
        run: |
          cd project
          [ -f ../scripts/add_packages.sh ] && source ../scripts/add_packages.sh || true
          [ -f ../scripts/custome_config.sh ] && source ../scripts/custome_config.sh || true
          cd friendlywrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build
        run: |
          cd project/friendlywrt
          echo "CONFIG_TARGET_rockchip=y" >> .config
          echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
          echo "CONFIG_CRYPTO_CHACHA20=y" >> .config
          echo "CONFIG_CRYPTO_CHACHA20_NEON=y" >> .config
          echo "CONFIG_CRYPTO_POLY1305=y" >> .config
          echo "CONFIG_CRYPTO_CHACHA20POLY1305=y" >> .config
          echo "CONFIG_PACKAGE_kmod-crypto-lib-chacha20=m" >> .config
          echo "CONFIG_PACKAGE_kmod-crypto-lib-chacha20poly1305=m" >> .config
          echo "CONFIG_PACKAGE_kmod-crypto-chacha20poly1305=m" >> .config
          echo "CONFIG_PACKAGE_kmod-amneziawg=m" >> .config
          echo "CONFIG_PACKAGE_amneziawg-go=m" >> .config
          echo "CONFIG_PACKAGE_amneziawg-tools=m" >> .config
          echo "CONFIG_PACKAGE_luci-proto-amneziawg=m" >> .config
          make defconfig

      - name: Download packages
        run: |
          cd project/friendlywrt
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \; 2>/dev/null || true

      - name: Build toolchain and kernel
        run: |
          cd project/friendlywrt
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          make target/linux/compile -j$(nproc)

      - name: Compile AmneziaWG packages
        run: |
          cd project/friendlywrt
          make package/kmod-amneziawg/{clean,download,prepare,compile} -j$(nproc) || make package/kmod-amneziawg/{clean,download,prepare,compile} -j1 V=s
          make package/amneziawg-go/{clean,download,prepare,compile} -j$(nproc) || make package/amneziawg-go/{clean,download,prepare,compile} -j1 V=s
          make package/amneziawg-tools/{clean,download,prepare,compile} -j$(nproc) || make package/amneziawg-tools/{clean,download,prepare,compile} -j1 V=s
          make package/luci-proto-amneziawg/{clean,download,prepare,compile} -j$(nproc) || make package/luci-proto-amneziawg/{clean,download,prepare,compile} -j1 V=s

      - name: Prepare artifacts
        run: |
          cd project/friendlywrt
          ARTIFACT_DIR=../../artifact/amneziawg-packages/${{ matrix.target_cpu }}
          mkdir -p "${ARTIFACT_DIR}"

          case ${{ matrix.target_cpu }} in
            rk3328|rk3528)
              ARCH="aarch64_cortex-a53"
              ;;
            rk3399|rk3576)
              ARCH="aarch64_cortex-a72_cortex-a53"
              ;;
            rk3566|rk3568)
              ARCH="aarch64_cortex-a55"
              ;;
            rk3588)
              ARCH="aarch64_cortex-a76_cortex-a55"
              ;;
            *)
              ARCH="aarch64_generic"
              ;;
          esac

          find "bin/targets" -name 'kmod-amneziawg*' -type f -exec cp {} "${ARTIFACT_DIR}" \; 2>/dev/null || true
          find "bin/packages/${ARCH}" -name '*amneziawg*' -type f -exec cp {} "${ARTIFACT_DIR}" \; 2>/dev/null || true
          find "bin/packages/${ARCH}" -name 'luci-proto-amneziawg*' -type f -exec cp {} "${ARTIFACT_DIR}" \; 2>/dev/null || true

      - name: Upload artifacts to draft release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare_release.outputs.release_tag }} # <-- ИЗМЕНЕНИЕ: Теперь эта ссылка работает правильно
          files: artifact/amneziawg-packages/${{ matrix.target_cpu }}/*
