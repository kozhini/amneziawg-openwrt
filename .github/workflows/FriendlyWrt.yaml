name: Build AmneziaWG KMOD for FriendlyWrt (Optimized)
on:
  workflow_dispatch:
    inputs:
      friendlywrt_version:
        description: "FriendlyWrt version"
        type: choice
        required: true
        default: "23.05"
        options:
          - "23.05"
          - "24.10"
      amneziawg_version:
        description: "AmneziaWG version"
        type: string
        required: true
        default: "master"
      target_cpu:
        description: "Target CPU (leave empty for all supported platforms)"
        type: choice
        required: false
        default: "rk3328"
        options:
          - ""
          - "rk3328"
          - "rk3399"
          - "rk3566"
          - "rk3568"
          - "rk3576"
          - "rk3588"

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
    steps:
      - name: Generate release tag
        id: release_tag
        run: |
          release_tag="AmneziaWG-KMOD-FriendlyWrt-${{ inputs.friendlywrt_version }}-$(date +%Y%m%d%H%M)"
          echo "release_tag=$release_tag" >> $GITHUB_OUTPUT
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.release_tag }}
          name: "AmneziaWG KMOD for FriendlyWrt ${{ inputs.friendlywrt_version }} - ${{ steps.release_tag.outputs.release_tag }}"
          draft: true
          prerelease: false

  build_amneziawg:
    needs: prepare_release
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target_cpu: ${{ inputs.target_cpu && fromJson(format('["{0}"]', inputs.target_cpu)) || fromJson('["rk3328","rk3399","rk3566","rk3568","rk3576","rk3588"]') }}
      fail-fast: false
    
    env:
      BUILD_DIR: friendlywrt-project/friendlywrt # Определение переменной для удобства

    steps:
      # --- 1. Подготовка репозиториев ---
      - name: Checkout main repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Checkout AmneziaWG OpenWRT repository
        uses: actions/checkout@v5
        with:
          repository: kozhini/amneziawg-openwrt
          path: amneziawg-openwrt
          ref: ${{ inputs.amneziawg_version }}
          fetch-depth: 0

      # --- 2. Инициализация окружения ---
      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Установка базовых зависимостей OpenWrt/FriendlyWrt
          sudo apt-get update
          sudo apt-get install -y python3-pyelftools python3-dev python3-setuptools swig wget git unzip libncurses5-dev libncursesw5-dev
          
          # Установка инструментария FriendlyWrt (сохраняем)
          wget https://raw.githubusercontent.com/friendlyarm/build-env-on-ubuntu-bionic/master/install.sh
          sed -i -e 's/^apt-get -y install openjdk-8-jdk/# apt-get -y install openjdk-8-jdk/g' install.sh
          sed -i -e 's/^\[ -d fa-toolchain \]/# [ -d fa-toolchain ]/g' install.sh
          sed -i -e 's/^(cat fa-toolchain/# (cat fa-toolchain/g' install.sh
          sed -i -e 's/^(tar xf fa-toolchain/# (tar xf fa-toolchain/g' install.sh
          sudo -E bash ./install.sh
          
          # Установка repo tool
          git clone https://github.com/friendlyarm/repo
          sudo cp repo/repo /usr/bin/
          
          # Базовая очистка и сброс swap
          sudo swapoff -a
          sudo apt clean
          df -h # Показать оставшееся место

      # --- 3. Загрузка FriendlyWrt и Кэширование ---
      - name: Download FriendlyWrt source (repo init/sync)
        run: |
          mkdir -p friendlywrt-project
          cd friendlywrt-project
          
          echo "=== Initializing repo with FriendlyWrt manifest ==="
          repo init --depth=1 \
            -u https://github.com/friendlyarm/friendlywrt_manifests \
            -b master-v${{ inputs.friendlywrt_version }} \
            -m ${{ matrix.target_cpu }}.xml \
            --repo-url=https://github.com/friendlyarm/repo \
            --no-clone-bundle
          
          echo "=== Syncing all components ==="
          repo sync -c --no-clone-bundle || {
            echo "⚠️ First sync attempt failed, retrying..."
            repo sync -c --no-clone-bundle
          }

      - name: Cache FriendlyWrt Download Folder (dl)
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_DIR }}/dl
          key: dl-${{ inputs.friendlywrt_version }}-${{ matrix.target_cpu }}-${{ hashFiles('${{ env.BUILD_DIR }}/feeds.conf.default') }}

      - name: Cache Toolchain and Build Folder
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}/staging_dir
            ${{ env.BUILD_DIR }}/build_dir
            ${{ env.BUILD_DIR }}/tmp
          key: toolchain-${{ inputs.friendlywrt_version }}-${{ matrix.target_cpu }}-${{ hashFiles('${{ env.BUILD_DIR }}/.config') }}
          restore-keys: |
            toolchain-${{ inputs.friendlywrt_version }}-${{ matrix.target_cpu }}-

      - name: Download packages (using cache)
        run: |
          cd ${{ env.BUILD_DIR }}
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \; 2>/dev/null || true

      # --- 4. Настройка сборки ---
      - name: Setup AmneziaWG feed, update/install feeds
        run: |
          cd ${{ env.BUILD_DIR }}
          
          echo "=== Adding AmneziaWG feed ==="
          echo "src-cpy amneziawg ../../amneziawg-openwrt" >> feeds.conf.default
          
          # Обновление и установка фидов
          echo "=== Updating feeds ==="
          ./scripts/feeds update -a || ./scripts/feeds update -a
          echo "=== Installing feeds ==="
          ./scripts/feeds install -a
          
          echo "=== Setting ENV variables ==="
          TARGET_IMAGE_DIRNAME=friendlywrt$(echo ${{ inputs.friendlywrt_version }} | awk -F . '{print $1}')
          echo "TARGET_IMAGE_DIRNAME=$TARGET_IMAGE_DIRNAME" >> $GITHUB_ENV
          echo "TARGET_FRIENDLYWRT_CONFIG=rockchip" >> $GITHUB_ENV

      - name: Configure build with AmneziaWG KMOD packages
        run: |
          cd ${{ env.BUILD_DIR }}
          
          # Начать с чистой конфигурации
          make defconfig
          
          # Конфигурация для AmneziaWG
          cat >> .config << EOF
          # Target configuration (minimal)
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          
          # Enable AmneziaWG packages (as modules 'm') - NO GO VERSION
          CONFIG_PACKAGE_kmod-amneziawg=m
          CONFIG_PACKAGE_amneziawg-tools=m
          CONFIG_PACKAGE_luci-proto-amneziawg=m
          
          # Required kernel crypto modules (explicitly selected)
          CONFIG_PACKAGE_kmod-crypto-aead=m
          CONFIG_PACKAGE_kmod-crypto-hash=m
          CONFIG_PACKAGE_kmod-crypto-kpp=m
          CONFIG_PACKAGE_kmod-crypto-skcipher=m
          CONFIG_PACKAGE_kmod-crypto-manager2=m
          
          # Specific crypto algorithms required by WireGuard/AmneziaWG
          CONFIG_CRYPTO_BLAKE2S=y
          CONFIG_CRYPTO_CHACHA20=y
          CONFIG_CRYPTO_CHACHA20POLY1305=y
          CONFIG_CRYPTO_POLY1305=y
          CONFIG_CRYPTO_CURVE25519=y
          
          # Disable building large images to save time and space
          # CONFIG_TARGET_ROOTFS_CPIOGZ is not set
          # CONFIG_TARGET_ROOTFS_TARGZ is not set
          # CONFIG_TARGET_ROOTFS_SQUASHFS is not set
          EOF
          
          # Запуск defconfig снова для разрешения зависимостей
          make defconfig
          
          echo "=== Final .config amneziawg/crypto settings ==="
          grep -E "(CRYPTO|amneziawg)" .config | head -15

      # --- 5. Сборка Toolchain и Kernel ---
      - name: Build Toolchain, Host Tools and Prepare Kernel
        run: |
          cd ${{ env.BUILD_DIR }}
          
          echo "=== Building essential toolchain and host tools ==="
          make tools/install -j$(nproc) V=s || true
          make toolchain/install -j$(nproc) V=s || true
          
          echo "=== Preparing target environment and kernel headers ==="
          # Эти шаги готовят окружение для внешних kmod
          make target/prepare V=s
          make target/linux/prepare V=s

      - name: Build crypto dependencies (kmod-* packages)
        run: |
          cd ${{ env.BUILD_DIR }}
          
          echo "=== Building crypto kernel modules ==="
          # Собираем все крипто-модули, которые мы выбрали в .config
          make package/kernel/linux/compile -j$(nproc) V=s

      # --- 6. Сборка AmneziaWG ---
      - name: Build AmneziaWG packages (kmod, tools, luci)
        run: |
          cd ${{ env.BUILD_DIR }}
          
          KMOD_PATH=$(ls feeds/amneziawg/ | grep -E "kmod|linux-kernel-module" | head -1) # Определяем имя kmod
          
          declare -A BUILD_STATUS
          
          # 1. Build userspace tools
          echo "--- Building amneziawg-tools ---"
          if make package/feeds/amneziawg/amneziawg-tools/compile -j$(nproc) V=s 2>&1 | tee /tmp/build-tools.log; then
            BUILD_STATUS[tools]="SUCCESS"
          else
            BUILD_STATUS[tools]="FAILED"
            tail -30 /tmp/build-tools.log || true
          fi
          
          # 2. Build kernel module
          if [ -n "$KMOD_PATH" ]; then
            echo "--- Building kernel module: $KMOD_PATH ---"
            if make package/feeds/amneziawg/$KMOD_PATH/compile -j$(nproc) V=s 2>&1 | tee /tmp/build-kmod.log; then
              BUILD_STATUS[kmod]="SUCCESS"
            else
              BUILD_STATUS[kmod]="FAILED"
              tail -50 /tmp/build-kmod.log || true
            fi
          else
            BUILD_STATUS[kmod]="SKIPPED"
          fi
          
          # 3. Build LuCI interface
          echo "--- Building luci-proto-amneziawg ---"
          if make package/feeds/amneziawg/luci-proto-amneziawg/compile -j$(nproc) V=s 2>&1 | tee /tmp/build-luci.log; then
            BUILD_STATUS[luci]="SUCCESS"
          else
            BUILD_STATUS[luci]="FAILED"
            tail -30 /tmp/build-luci.log || true
          fi
          
          # Install all successfully compiled packages for IPK creation
          echo "=== Installing all packages ==="
          make package/install -j$(nproc) V=s || true
          
          echo "=== Build Summary ==="
          for pkg in tools kmod luci; do
            echo "$pkg: ${BUILD_STATUS[$pkg]}"
          done
          
          mkdir -p /tmp/build-logs
          cp /tmp/build-*.log /tmp/build-logs/ 2>/dev/null || true

      - name: Create package index and debug results
        run: |
          cd ${{ env.BUILD_DIR }}
          
          echo "=== Creating package index ==="
          make package/index V=s 2>&1 | grep -v "usign" || true
          
          echo "=== Comprehensive package search ==="
          find bin -name "*amneziawg*.ipk" -type f -ls 2>/dev/null || echo "No AmneziaWG IPK files found."

      # --- 7. Артефакты и релиз ---
      - name: Prepare artifacts - IPK files only
        shell: bash
        run: |
          set +e # Don't exit on error
          cd ${{ env.BUILD_DIR }}
          ARTIFACT_DIR=../../artifact/amneziawg-packages/${{ matrix.target_cpu }}
          mkdir -p "${ARTIFACT_DIR}"
          
          echo "=== Searching for AmneziaWG and Crypto IPK files ==="
          
          # Фильтр для копирования ТОЛЬКО AmneziaWG и необходимых Crypto пакетов
          find bin -name "*.ipk" -type f 2>/dev/null | while read file; do
            filename=$(basename "$file")
            # Копируем AmneziaWG и ключевые crypto зависимости
            if [[ "$filename" =~ (amneziawg|crypto-aead|crypto-hash|crypto-kpp|crypto-skcipher|crypto-chacha|crypto-poly|crypto-curve|crypto-blake) ]]; then
              cp "$file" "${ARTIFACT_DIR}/" && echo "✅ Found: $filename" || true
            fi
          done
          
          IPK_COUNT=$(find "${ARTIFACT_DIR}" -name "*.ipk" -type f 2>/dev/null | wc -l)
          echo "=== Total AmneziaWG/Crypto IPK files found: $IPK_COUNT ==="
          
          # Копирование логов и создание отчета (сохранено для диагностики)
          cp /tmp/build-logs/* "${ARTIFACT_DIR}/" 2>/dev/null || true
          
          echo "=== Final artifact directory ==="
          ls -lh "${ARTIFACT_DIR}/" || true
          exit 0

      - name: Upload IPK packages to draft release
        if: always()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare_release.outputs.release_tag }}
          files: |
            artifact/amneziawg-packages/${{ matrix.target_cpu }}/*.ipk
            artifact/amneziawg-packages/${{ matrix.target_cpu }}/*.txt
