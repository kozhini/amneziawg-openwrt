name: Build AmneziaWG for FriendlyWrt (Stable Build)
on:
  workflow_dispatch:
    inputs:
      friendlywrt_version:
        description: "FriendlyWrt version"
        type: choice
        required: true
        default: "24.10"
        options:
          - "23.05"
          - "24.10"
      amneziawg_version:
        description: "AmneziaWG version"
        type: string
        required: true
        default: "master"
      target_cpu:
        description: "Target CPU"
        type: choice
        required: false
        default: "rk3328"
        options:
          - ""
          - "rk3328"
          - "rk3399"
          - "rk3566"
          - "rk3568"
          - "rk3576"
          - "rk3588"

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
    steps:
      - name: Generate release tag
        id: release_tag
        run: |
          release_tag="AmneziaWG-FriendlyWrt-${{ inputs.friendlywrt_version }}-$(date +%Y%m%d-%H%M)"
          echo "release_tag=$release_tag" >> $GITHUB_OUTPUT
      
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.release_tag }}
          name: "AmneziaWG FriendlyWrt ${{ inputs.friendlywrt_version }}"
          draft: true
          prerelease: false

  build_amneziawg:
    needs: prepare_release
    runs-on: ubuntu-22.04
    timeout-minutes: 360  # 6 hours max
    strategy:
      matrix:
        target_cpu: ${{ inputs.target_cpu && fromJson(format('["{0}"]', inputs.target_cpu)) || fromJson('["rk3328","rk3399","rk3566","rk3568","rk3588"]') }}
      fail-fast: false
    
    env:
      TERM: xterm
      FORCE_UNSAFE_CONFIGURE: 1
      BUILD_DIR: friendlywrt-project/friendlywrt
      
    steps:
      - name: Checkout repositories
        uses: actions/checkout@v5
        with:
          submodules: true
          
      - name: Checkout AmneziaWG
        uses: actions/checkout@v5
        with:
          repository: kozhini/amneziawg-openwrt
          path: amneziawg-openwrt
          ref: ${{ inputs.amneziawg_version }}
          
      - name: Install essential build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget curl qemu-utils \
            python3-setuptools python3-dev swig libelf-dev \
            python3-pyelftools python3-pip
          python3 -c "import elftools" || sudo pip3 install pyelftools
          echo "=== Verifying Python3 elftools ==="
          python3 -c "import elftools; print('✅ elftools version:', elftools.__version__)"
          
      - name: Setup repo tool
        run: |
          git clone --depth 1 https://github.com/friendlyarm/repo
          sudo cp repo/repo /usr/bin/
          sudo chmod +x /usr/bin/repo
          
      - name: Download FriendlyWrt source
        run: |
          mkdir -p friendlywrt-project
          cd friendlywrt-project
          
          BRANCH="master-v${{ inputs.friendlywrt_version }}"
          MANIFEST="${{ matrix.target_cpu }}.xml"
          
          echo "=== Verifying manifest exists ==="
          if wget -q --spider "https://raw.githubusercontent.com/friendlyarm/friendlywrt_manifests/$BRANCH/$MANIFEST"; then
            echo "✅ Manifest file exists: $MANIFEST"
          else
            echo "❌ ERROR: Manifest not found!"
            exit 1
          fi
          
          echo "=== Initializing repo ==="
          repo init --depth=1 \
            -u https://github.com/friendlyarm/friendlywrt_manifests \
            -b $BRANCH \
            -m $MANIFEST \
            --repo-url=https://github.com/friendlyarm/repo \
            --no-clone-bundle
            
          echo "=== Syncing source ==="
          repo sync -c --no-clone-bundle -j4 || {
            echo "⚠️ Parallel sync failed, trying sequential..."
            repo sync -c --no-clone-bundle
          }
          
      - name: Setup AmneziaWG feed
        run: |
          cd ${{ env.BUILD_DIR }}
          
          # ИСПРАВЛЕНИЕ: Используем src-cpy для надежного копирования фида
          echo "src-cpy amneziawg ../../amneziawg-openwrt" >> feeds.conf.default
          
          echo "=== Updating feeds (with retries) ==="
          for i in {1..3}; do
            if ./scripts/feeds update -a; then
              echo "✅ Feeds updated"
              break
            else
              echo "⚠️ Attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done
          
          echo "=== Installing feeds ==="
          ./scripts/feeds install -a
          
      - name: Configure build
        run: |
          cd ${{ env.BUILD_DIR }}
          
          make defconfig
          
          cat >> .config << 'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_PACKAGE_kmod-amneziawg=m
          CONFIG_PACKAGE_amneziawg-tools=m
          CONFIG_PACKAGE_luci-proto-amneziawg=m
          # Настройки криптографии ядра, необходимые для kmod-amneziawg
          CONFIG_CRYPTO_CHACHA20=y
          CONFIG_CRYPTO_POLY1305=y
          CONFIG_CRYPTO_CHACHA20POLY1305=y
          CONFIG_CRYPTO_CURVE25519=y
          EOF
          
          make defconfig
          
          echo "=== Final config check ==="
          grep -E "(amneziawg|CRYPTO)" .config | head -20

      # НОВЫЙ КРИТИЧЕСКИ ВАЖНЫЙ ШАГ
      - name: Disable problematic package
        run: |
          cd ${{ env.BUILD_DIR }}
          
          echo "=== Disabling gpio-button-hotplug to fix kernel build ==="
          
          # Используем scripts/config для явного отключения пакета.
          # Флаг '-d' (disable) более надежен, чем sed.
          
          # Отключаем CONFIG_PACKAGE_
          ./scripts/config --file .config -d CONFIG_PACKAGE_gpio_button_hotplug
          ./scripts/config --file .config -d CONFIG_PACKAGE_kmod_gpio_button_hotplug
          
          # Отключаем CONFIG_DEFAULT_ (чтобы make defconfig не добавил его снова)
          ./scripts/config --file .config -d CONFIG_DEFAULT_gpio_button_hotplug
          ./scripts/config --file .config -d CONFIG_DEFAULT_kmod_gpio_button_hotplug
          
          # Запускаем defconfig для финализации изменений и удаления зависимостей
          make defconfig
          
          echo "✅ gpio-button-hotplug explicitly disabled."
          # Проверка: если пакет присутствует, он должен быть отключен (=n).
          if grep "gpio-button-hotplug" .config; then
              if grep "gpio-button-hotplug=n" .config; then
                  echo "✅ Package successfully disabled (=n)."
              else
                  echo "❌ ERROR: Package still enabled!"
                  exit 1
              fi
          else
              echo "✅ Package successfully removed from .config"
          fi
          
      - name: Download packages
        run: |
          cd ${{ env.BUILD_DIR }}
          echo "=== Downloading packages ==="
          make download -j8 V=s || make download -j1 V=s
          find dl -size -1024c -exec rm -f {} \;
          
# ... (предыдущие шаги без изменений)

      - name: Build toolchain (Stage 1 - Critical)
        id: build_toolchain
        continue-on-error: true
        run: |
          cd ${{ env.BUILD_DIR }}
          
          echo "=== Building toolchain (critical stage) ==="
          make toolchain/install -j2 V=s 2>&1 | tee /tmp/build-toolchain.log || {
            echo "❌ Toolchain build failed"
            tail -200 /tmp/build-toolchain.log
            exit 1
          }
          echo "✅ Toolchain built successfully"

      - name: Build Host Tools (Stage 1.5 - FIX opkg)
        run: |
          cd ${{ env.BUILD_DIR }}
          echo "=== Building tools (opkg) ==="
          make -k tools/install -j$(nproc) V=s || true
          echo "✅ Host tools prepared."

      # Скорректированный Stage 2: Установка ядра с игнорированием ошибок
      - name: Build and Install Kernel and Headers (Stage 2)
        run: |
          cd ${{ env.BUILD_DIR }}
          
          echo "=== 1/2: Preparing kernel (Compiling) ==="
          # Сначала компилируем все. Используем -k для пропуска ошибок в других модулях
          make -k target/linux/prepare -j4 V=s 2>&1 | tee /tmp/build-kernel-prep.log || true
          
          echo "=== 2/2: Installing kernel headers (Critical for kmod) ==="
          # Эксплицитная установка с -k, чтобы игнорировать ошибки, связанные с 'image'
          # Ошибки, которые вы видели (target/linux/rockchip/image), часто не критичны для сборки kmod
          make -k target/linux/install -j$(nproc) V=s 2>&1 | tee -a /tmp/build-kernel-prep.log || true

      # Stage 4: Разделение компиляции и установки остается в силе
      - name: Build AmneziaWG packages (Stage 4)
        run: |
          cd ${{ env.BUILD_DIR }}
          
          # ... (логика поиска KMOD_PKG без изменений)
          KMOD_PATH=$(find feeds/amneziawg -maxdepth 1 -type d -name "*kmod*" -o -name "*kernel*" | head -1)
          if [ -n "$KMOD_PATH" ]; then
            KMOD_PKG=$(basename "$KMOD_PATH")
            echo "✅ KMOD Package found: $KMOD_PKG"
          else
            KMOD_PKG=""
            echo "❌ ERROR: KMOD Package NOT found in feeds/amneziawg."
            exit 1
          fi

          # 1. Компиляция всех целевых пакетов
          echo "=== Building all three AmneziaWG targets (Compile stage) ==="
          make -k package/feeds/amneziawg/amneziawg-tools/compile \
               package/feeds/amneziawg/$KMOD_PKG/compile \
               package/feeds/amneziawg/luci-proto-amneziawg/compile -j4 V=s 2>&1 | tee /tmp/build-awg-compile.log || {
            echo "⚠️ Compilation finished with errors (expected due to -k). Check build-awg-compile.log"
          }

          # 2. Установка (создание IPK) для amneziawg-tools
          echo "=== Installing amneziawg-tools (IPK creation) ==="
          make package/feeds/amneziawg/amneziawg-tools/install -j1 V=s || true

          # 3. Установка (создание IPK) для kmod-amneziawg
          echo "=== Installing kernel module: $KMOD_PKG (IPK creation) ==="
          make package/feeds/amneziawg/$KMOD_PKG/install -j1 V=s 2>&1 | tee /tmp/build-awg-kmod-install.log || {
            echo "❌ Kmod install failed. Check build-awg-kmod-install.log"
          }

          # 4. Установка (создание IPK) для luci-proto-amneziawg
          echo "=== Installing luci-proto-amneziawg (IPK creation) ==="
          make package/feeds/amneziawg/luci-proto-amneziawg/install -j1 V=s || true

          echo "=== Creating package index ==="
          make package/index V=s 2>&1 | grep -v "usign" || true
          
      # ... (последующие шаги без изменений)
      - name: Collect artifacts
        if: always()
        shell: bash
        run: |
          set +e
          ARTIFACT_DIR=artifact/amneziawg-packages/${{ matrix.target_cpu }}
          mkdir -p "${ARTIFACT_DIR}/logs"
          
          echo "=== Searching for IPK files ==="
          find ${{ env.BUILD_DIR }}/bin -name "*.ipk" -type f 2>/dev/null | while read file; do
            filename=$(basename "$file")
            
            # Фильтр только для запрошенных пакетов
            if [[ "$filename" =~ (kmod-amneziawg|amneziawg-tools|luci-proto-amneziawg) ]]; then
              cp "$file" "${ARTIFACT_DIR}/"
              echo "✅ $filename"
            fi
          done
          
          IPK_COUNT=$(find "${ARTIFACT_DIR}" -name "*.ipk" 2>/dev/null | wc -l)
          
          # Копируем все логи
          cp /tmp/build-*.log "${ARTIFACT_DIR}/logs/" 2>/dev/null || true
          
          # ИСПРАВЛЕНИЕ YAML: Все строки Heredoc имеют отступ
          cat > "${ARTIFACT_DIR}/BUILD-REPORT.txt" << EOF
          AmneziaWG Build Report
          =====================
          Platform: ${{ matrix.target_cpu }}
          FriendlyWrt: ${{ inputs.friendlywrt_version }}
          AmneziaWG: ${{ inputs.amneziawg_version }}
          Build Date: $(date)
          Toolchain Status: ${{ steps.build_toolchain.outcome }}

          Packages Found: $IPK_COUNT

          Files:
          $(ls -lh "${ARTIFACT_DIR}"/*.ipk 2>/dev/null || echo "No IPK files found")

          Installation Instructions:
          ==========================
          1. Upload .ipk files to your router:
             scp *.ipk root@YOUR_ROUTER_IP:/tmp/
          2. SSH to router and install:
             ssh root@YOUR_ROUTER_IP
             cd /tmp
             opkg install kmod-amneziawg*.ipk
             opkg install amneziawg-tools*.ipk
             opkg install luci-proto-amneziawg*.ipk
          3. Reboot:
             reboot

          Logs:
          =====
          Build logs are available in logs/ directory
          EOF
          
          if [ $IPK_COUNT -ne 3 ]; then # Проверяем, что найдено ровно 3 пакета
            echo "" >> "${ARTIFACT_DIR}/BUILD-REPORT.txt"
            echo "❌ ВНИМАНИЕ: Найдено $IPK_COUNT пакетов (ожидалось 3). Проверьте логи." >> "${ARTIFACT_DIR}/BUILD-REPORT.txt"
          fi
          
          cat "${ARTIFACT_DIR}/BUILD-REPORT.txt"
          exit 0
          
      - name: Upload artifacts to release
        if: always()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare_release.outputs.release_tag }}
          files: |
            artifact/amneziawg-packages/${{ matrix.target_cpu }}/*.ipk
            artifact/amneziawg-packages/${{ matrix.target_cpu }}/BUILD-REPORT.txt
            artifact/amneziawg-packages/${{ matrix.target_cpu }}/logs/*.log
