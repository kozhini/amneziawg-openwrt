name: Build AmneziaWG KMOD for FriendlyWrt (Final Optimized)
on:
  workflow_dispatch:
    inputs:
      friendlywrt_version:
        description: "FriendlyWrt version"
        type: choice
        required: true
        default: "24.10"
        options:
          - "23.05"
          - "24.10"
      amneziawg_version:
        description: "AmneziaWG version"
        type: string
        required: true
        default: "master"
      target_cpu:
        description: "Target CPU (leave empty for all supported platforms)"
        type: choice
        required: false
        default: "rk3328"
        options:
          - ""
          - "rk3328"
          - "rk3399"
          - "rk3566"
          - "rk3568"
          - "rk3576"
          - "rk3588"

jobs:
  prepare_release:
    runs-on: ubuntu-22.04
    outputs:
      release_tag: ${{ steps.release_tag.outputs.release_tag }}
    steps:
      - name: Generate release tag
        id: release_tag
        run: |
          release_tag="AmneziaWG-KMOD-FriendlyWrt-${{ inputs.friendlywrt_version }}-$(date +%Y%m%d%H%M)"
          echo "release_tag=$release_tag" >> $GITHUB_OUTPUT
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_tag.outputs.release_tag }}
          name: "AmneziaWG KMOD for FriendlyWrt ${{ inputs.friendlywrt_version }} - ${{ steps.release_tag.outputs.release_tag }}"
          draft: true
          prerelease: false

  build_amneziawg:
    needs: prepare_release
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target_cpu: ${{ inputs.target_cpu && fromJson(format('["{0}"]', inputs.target_cpu)) || fromJson('["rk3328","rk3399","rk3566","rk3568","rk3576","rk3588"]') }}
      fail-fast: false
    
    env:
      BUILD_DIR: friendlywrt-project/friendlywrt
      TERM: xterm # 👈 FIX: Установка TERM для избежания ошибки "Error opening terminal: unknown."

    steps:
      # --- 1. Подготовка репозиториев и инициализация ---
      - name: Checkout main repository and AmneziaWG
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Checkout AmneziaWG OpenWRT repository
        uses: actions/checkout@v5
        with:
          repository: kozhini/amneziawg-openwrt
          path: amneziawg-openwrt
          ref: ${{ inputs.amneziawg_version }}
          fetch-depth: 0

      - name: Initialize build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Установка базовых зависимостей и инструментария FriendlyWrt
          sudo apt-get update
          sudo apt-get install -y python3-pyelftools python3-dev python3-setuptools swig wget git unzip libncurses5-dev libncursesw5-dev
          wget https://raw.githubusercontent.com/friendlyarm/build-env-on-ubuntu-bionic/master/install.sh
          sed -i -e 's/^apt-get -y install openjdk-8-jdk/# apt-get -y install openjdk-8-jdk/g' install.sh
          sed -i -e 's/^\[ -d fa-toolchain \]/# [ -d fa-toolchain ]/g' install.sh
          sed -i -e 's/^(cat fa-toolchain/# (cat fa-toolchain/g' install.sh
          sed -i -e 's/^(tar xf fa-toolchain/# (tar xf fa-toolchain/g' install.sh
          sudo -E bash ./install.sh
          git clone https://github.com/friendlyarm/repo
          sudo cp repo/repo /usr/bin/
          sudo swapoff -a; sudo apt clean; df -h

      # --- 2. Загрузка FriendlyWrt и Кэширование ---
      - name: Download FriendlyWrt source (repo init/sync)
        run: |
          mkdir -p friendlywrt-project; cd friendlywrt-project
          repo init --depth=1 -u https://github.com/friendlyarm/friendlywrt_manifests -b master-v${{ inputs.friendlywrt_version }} -m ${{ matrix.target_cpu }}.xml --repo-url=https://github.com/friendlyarm/repo --no-clone-bundle
          repo sync -c --no-clone-bundle || { echo "⚠️ First sync attempt failed, retrying..."; repo sync -c --no-clone-bundle; }

      - name: Cache FriendlyWrt Download Folder (dl)
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_DIR }}/dl
          key: dl-${{ inputs.friendlywrt_version }}-${{ matrix.target_cpu }}-${{ hashFiles('${{ env.BUILD_DIR }}/feeds.conf.default') }}

      - name: Cache Toolchain and Build Folder
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}/staging_dir
            ${{ env.BUILD_DIR }}/build_dir
            ${{ env.BUILD_DIR }}/tmp
          key: toolchain-${{ inputs.friendlywrt_version }}-${{ matrix.target_cpu }}-${{ hashFiles('${{ env.BUILD_DIR }}/.config') }}
          restore-keys: |
            toolchain-${{ inputs.friendlywrt_version }}-${{ matrix.target_cpu }}-

      # --- 3. Конфигурация и загрузка (ПОРЯДОК ИСПРАВЛЕН) ---
      - name: Setup AmneziaWG feed, update/install feeds
        run: |
          cd ${{ env.BUILD_DIR }}
          
          echo "=== Adding AmneziaWG feed ==="
          echo "src-cpy amneziawg ../../amneziawg-openwrt" >> feeds.conf.default
          
          # 👈 ИСПРАВЛЕНИЕ: Добавление логики повторных попыток для обновления фидов
          ATTEMPTS=3
          for i in $(seq 1 $ATTEMPTS); do
            echo "=== Attempt $i to update feeds... ==="
            if ./scripts/feeds update -a; then
              echo "✅ Feeds updated successfully."
              break
            elif [ $i -eq $ATTEMPTS ]; then
              echo "❌ All $ATTEMPTS attempts to update feeds failed."
              exit 1
            else
              echo "Waiting 10 seconds before retrying..."
              sleep 10
            fi
          done
          
          echo "=== Installing feeds ==="
          ./scripts/feeds install -a
          
          TARGET_IMAGE_DIRNAME=friendlywrt$(echo ${{ inputs.friendlywrt_version }} | awk -F . '{print $1}')
          echo "TARGET_IMAGE_DIRNAME=$TARGET_IMAGE_DIRNAME" >> $GITHUB_ENV
          echo "TARGET_FRIENDLYWRT_CONFIG=rockchip" >> $GITHUB_ENV

      - name: Configure build with AmneziaWG KMOD packages
        run: |
          cd ${{ env.BUILD_DIR }}
          
          # Запускаем defconfig, чтобы избежать ошибки "unknown terminal" на следующем make
          make defconfig 
          
          # Конфигурация для AmneziaWG (без GO)
          cat >> .config << EOF
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_PACKAGE_kmod-amneziawg=m
          CONFIG_PACKAGE_amneziawg-tools=m
          CONFIG_PACKAGE_luci-proto-amneziawg=m
          CONFIG_PACKAGE_kmod-crypto-aead=m
          CONFIG_PACKAGE_kmod-crypto-hash=m
          CONFIG_PACKAGE_kmod-crypto-kpp=m
          CONFIG_PACKAGE_kmod-crypto-skcipher=m
          CONFIG_PACKAGE_kmod-crypto-manager2=m
          CONFIG_CRYPTO_BLAKE2S=y
          CONFIG_CRYPTO_CHACHA20=y
          CONFIG_CRYPTO_CHACHA20POLY1305=y
          CONFIG_CRYPTO_POLY1305=y
          CONFIG_CRYPTO_CURVE25519=y
          EOF
          
          make defconfig

      - name: Download packages (using cache)
        run: |
          cd ${{ env.BUILD_DIR }}
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \; 2>/dev/null || true

      # --- 4. Сборка Toolchain и Kernel (ИСПРАВЛЕНИЕ KMOD) ---
      - name: Build Toolchain, Host Tools and Install Kernel Headers (FIX KMOD - Throttled)
        run: |
          cd ${{ env.BUILD_DIR }}
          
          # 💡 FIX: Ограничение потоков для предотвращения OOM/Тайм-аута во время самой тяжелой компиляции.
          
          echo "=== 1/4: Building essential tools (Throttled to -j1) ==="
          make tools/install -j1 V=s || true
          
          echo "=== 2/4: Building toolchain (Throttled to -j1) ==="
          make toolchain/install -j1 V=s || true
          
          # Используем все потоки для более быстрых операций установки заголовков
          echo "=== 3/4: Installing target environment (Full speed) ==="
          make target/install -j$(nproc) V=s
          
          echo "=== 4/4: Installing kernel headers (Full speed) ==="
          make target/linux/install -j$(nproc) V=s

      - name: Build crypto dependencies (kmod-* packages)
        run: |
          cd ${{ env.BUILD_DIR }}
          echo "=== Building crypto kernel modules ==="
          make package/kernel/linux/compile -j$(nproc) V=s

      # --- 5. Сборка AmneziaWG ---
      - name: Build AmneziaWG packages (kmod, tools, luci)
        run: |
          cd ${{ env.BUILD_DIR }}
          
          KMOD_PATH=$(ls feeds/amneziawg/ | grep -E "kmod|linux-kernel-module" | head -1)
          
          # 1. Build userspace tools
          echo "--- Building amneziawg-tools ---"
          make package/feeds/amneziawg/amneziawg-tools/compile -j$(nproc) V=s 2>&1 | tee /tmp/build-tools.log || true
          
          # 2. Build kernel module
          if [ -n "$KMOD_PATH" ]; then
            echo "--- Building kernel module: $KMOD_PATH ---"
            make package/feeds/amneziawg/$KMOD_PATH/compile -j$(nproc) V=s 2>&1 | tee /tmp/build-kmod.log || true
          fi
          
          # 3. Build LuCI interface
          echo "--- Building luci-proto-amneziawg ---"
          make package/feeds/amneziawg/luci-proto-amneziawg/compile -j$(nproc) V=s 2>&1 | tee /tmp/build-luci.log || true
          
          # Устанавливаем все скомпилированные пакеты для создания IPK
          echo "=== Installing all packages ==="
          make package/install -j$(nproc) V=s || true
          
          mkdir -p /tmp/build-logs; cp /tmp/build-*.log /tmp/build-logs/ 2>/dev/null || true

      # --- 6. Артефакты и релиз ---
      - name: Create package index and debug results
        run: |
          cd ${{ env.BUILD_DIR }}
          make package/index V=s 2>&1 | grep -v "usign" || true
          find bin -name "*amneziawg*.ipk" -type f -ls 2>/dev/null || echo "No AmneziaWG IPK files found."

      - name: Prepare artifacts - IPK files only
        shell: bash
        run: |
          set +e
          cd ${{ env.BUILD_DIR }}
          ARTIFACT_DIR=../../artifact/amneziawg-packages/${{ matrix.target_cpu }}
          mkdir -p "${ARTIFACT_DIR}"
          
          find bin -name "*.ipk" -type f 2>/dev/null | while read file; do
            filename=$(basename "$file")
            if [[ "$filename" =~ (amneziawg|crypto-aead|crypto-hash|crypto-kpp|crypto-skcipher|crypto-chacha|crypto-poly|crypto-curve|crypto-blake) ]]; then
              cp "$file" "${ARTIFACT_DIR}/" && echo "✅ Found: $filename" || true
            fi
          done
          
          cp /tmp/build-logs/* "${ARTIFACT_DIR}/" 2>/dev/null || true
          echo "=== Total IPK files found: $(find "${ARTIFACT_DIR}" -name "*.ipk" -type f 2>/dev/null | wc -l) ==="
          ls -lh "${ARTIFACT_DIR}/" || true
          exit 0

      - name: Upload IPK packages to draft release
        if: always()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare_release.outputs.release_tag }}
          files: |
            artifact/amneziawg-packages/${{ matrix.target_cpu }}/*.ipk
            artifact/amneziawg-packages/${{ matrix.target_cpu }}/*.txt
